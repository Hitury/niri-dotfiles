[plugins]
auto_update = "none"
enabled = [
    "oldirtty/color_picker",
    "noctalia/notes",
    "noctalia/wallhaven",
    "alexander/game-launcher",
    "dunarand/bookmarks",
    "avivbintangaringga/nextboot-selector",
    "alexander/screen-toolkit",
    "radimous/prismlauncher-instances",
    "thaer99ob/default-apps",
    "ashur-d/nvim-projects",
    "styrish/modernclock",
    "aabidk20/yt-music"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_color = "primary"
avatar_path = ""
font_family = "Iosevka NF"
lang = "en"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
polkit_agent = true
show_location = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    compact = true
    pinned = [ "firefox", "steam", "com.obsproject.Studio", "org.kde.plasma-systemmonitor", "kdesystemsettings", "btop" ]
    show_app_actions = true
    show_settings_button = false
    width = 620

    [shell.panel]
    clipboard_placement = "attached"
    control_center_placement = "floating"
    open_near_click_clipboard = true
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 1
    
[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "helix", "hyprland", "kitty", "niri", "qt", "umbriel" ]
    community_ids = [
        "spicetify",
        "pywalfox-beta4",
        "discord",
        "neovim",
        "vscode",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "obs",
        "seanime",
        "lazygit",
        "yazi"
    ]

[wallpaper]
edge_smoothness = 0.069999998435378075
fill_mode = "stretch"
transition = [ "disc", "wipe" ]
transition_duration = 1100
transition_on_startup = true

[weather]
refresh_minutes = 10

