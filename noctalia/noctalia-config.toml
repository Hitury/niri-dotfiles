enabled = true
tint_intensity = 0.46999998949468136

[bar]
order = [ "Waybar" ]

    [bar.Waybar]
    background_opacity = 0.4999999888241291
    center = [ "group:g4" ]
    end = [ "group:g3" ]
    hover_highlight = false
    margin_ends = 1
    padding = 20
    radius = 0
    shadow = false
    start = [ "group:g1" ]
    thickness = 44
    widget_spacing = 12

        [[bar.Waybar.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface"
        id = "g1"
        members = [ "workspaces", "wallpaper", "nextboot-selector", "notes", "tracker", "widget_3" ]
        opacity = 0.0
        padding = 11.0
        widget_spacing = 16

        [[bar.Waybar.capsule_group]]
        accordion = false
        accordion_direction = "start"
        border = ""
        border_width = 1.0
        enabled = true
        fill = "surface"
        id = "g3"
        members = [ "tray", "widget_4", "notifications", "clipboard", "volume" ]
        opacity = 0.0
        padding = 9.0
        widget_spacing = 20

        [[bar.Waybar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g4"
        members = [ "clock", "spacer_1" ]
        opacity = 0.0
        padding = 32.0

[brightness]
